<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Практична робота №4. Mechanical Keyboard Layout використовуючи Grid</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="keyboard-case">
        
        <div class="main-keys">
            <!-- Ряд 1: F-клавіші -->
            <a href="../../index.html" class="key-link"> <div class="key u-1 accent row-f">Esc</div> </a>
            <div class="gap-f-esc row-f"></div>
            <div class="key u-1 row-f">F1</div>
            <div class="key u-1 row-f">F2</div>
            <div class="key u-1 row-f">F3</div>
            <div class="key u-1 row-f">F4</div>
            <div class="gap-f-half row-f"></div>
            <div class="key u-1 row-f">F5</div>
            <div class="key u-1 row-f">F6</div>
            <div class="key u-1 row-f">F7</div>
            <div class="key u-1 row-f">F8</div>
            <div class="gap-f-half row-f"></div>
            <div class="key u-1 row-f">F9</div>
            <div class="key u-1 row-f">F10</div>
            <div class="key u-1 row-f">F11</div>
            <div class="key u-1 row-f">F12</div>
            
            <!-- Ряд 2 -->
            <div class="key u-1">~</div>
            <div class="key u-1">1</div>
            <div class="key u-1">2</div>
            <div class="key u-1">3</div>
            <div class="key u-1">4</div>
            <div class="key u-1">5</div>
            <div class="key u-1">6</div>
            <div class="key u-1">7</div>
            <div class="key u-1">8</div>
            <div class="key u-1">9</div>
            <div class="key u-1">0</div>
            <div class="key u-1">-</div>
            <div class="key u-1">=</div>
            <div class="key u-2">Backspace</div>

            <!-- Ряд 3 -->
            <div class="key u-1-5">Tab</div>
            <div class="key u-1">Q</div>
            <div class="key u-1">W</div>
            <div class="key u-1">E</div>
            <div class="key u-1">R</div>
            <div class="key u-1">T</div>
            <div class="key u-1">Y</div>
            <div class="key u-1">U</div>
            <div class="key u-1">I</div>
            <div class="key u-1">O</div>
            <div class="key u-1">P</div>
            <div class="key u-1">[</div>
            <div class="key u-1">]</div>
            <div class="key u-1-5">\</div>

            <!-- Ряд 4 -->
            <div class="key u-1-75">Caps</div>
            <div class="key u-1">A</div>
            <div class="key u-1">S</div>
            <div class="key u-1">D</div>
            <div class="key u-1">F</div>
            <div class="key u-1">G</div>
            <div class="key u-1">H</div>
            <div class="key u-1">J</div>
            <div class="key u-1">K</div>
            <div class="key u-1">L</div>
            <div class="key u-1">;</div>
            <div class="key u-1">'</div>
            <div class="key u-2-25 accent">Enter</div>

            <!-- Ряд 5 -->
            <div class="key u-2-25">Shift</div>
            <div class="key u-1">Z</div>
            <div class="key u-1">X</div>
            <div class="key u-1">C</div>
            <div class="key u-1">V</div>
            <div class="key u-1">B</div>
            <div class="key u-1">N</div>
            <div class="key u-1">M</div>
            <div class="key u-1">,</div>
            <div class="key u-1">.</div>
            <div class="key u-1">/</div>
            <div class="key u-2-75">Shift</div>

            <!-- Ряд 6 -->
            <div class="key u-1-25">Ctrl</div>
            <div class="key u-1-25">Win</div>
            <div class="key u-1-25">Alt</div>
            <div class="key u-6-25 accent">Space</div>
            <div class="key u-1-25">Alt</div>
            <div class="key u-1-25">Win</div>
            <div class="key u-1-25">Fn</div>
            <div class="key u-1-25">Ctrl</div>
        </div>

       
        <div class="nav-keys">
         
            <div class="key row-f">PS</div>
            <div class="key row-f">SL</div>
            <div class="key row-f">PB</div>
            <div class="key">Ins</div>
            <div class="key">Home</div>
            <div class="key">PgUp</div>
            <div class="key">Del</div>
            <div class="key">End</div>
            <div class="key">PgDn</div>
            
            <div class="nav-spacer"></div>
            
            <div class="nav-empty"></div>
            <div class="key">↑</div>
            <div class="nav-empty"></div>
            <div class="key">←</div>
            <div class="key">↓</div>
            <div class="key">→</div>
        </div>

       <div class="numpad">

            <div class="numpad-spacer"></div>
            
            <div class="key">Num</div>
            <div class="key">/</div>
            <div class="key">*</div>
            <div class="key">-</div>
            

            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="key n-tall">+</div>
            
            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
            
            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="key n-tall">Enter</div>
            
            <div class="key n-wide">0</div>
            <div class="key">.</div>
        </div>

    </div>

</body>
</html>
