<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="planner-wrapper">
        <div class="planner-inner">
            

            <header class="planner-header">
                  <a href="../../index.html" class="key-link"> <h1>WEEKLY PLAN</h1> </a>
                
                <div class="header-inputs">
                    <div class="input-group">
                        <label for="week-of">WEEK OF</label>
                        <input type="text" id="week-of" class="line-input">
                    </div>
                    <div class="input-group">
                        <label for="healthy-habit">HEALTHY HABIT</label>
                        <input type="text" id="healthy-habit" class="line-input">
                    </div>
                </div>

                <div class="header-checks">
                    <label class="check-item">
                        ROCKED IT <input type="checkbox" class="checkbox">
                    </label>
                    <label class="check-item">
                        ROOM FOR IMPROVEMENT <input type="checkbox" class="checkbox">
                    </label>
                </div>
            </header>

            <main class="planner-body">
                
                <aside class="sidebar">
                    <div class="todo-title">TO DO</div>
                    
                    <div class="section-title">TOP 3 GOALS</div>
                    <div class="task-list">
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                    </div>

                    <div class="section-title">EVERYTHING ELSE</div>
                    <div class="task-list">
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                    </div>

                    <div class="section-title">NEXT WEEK</div>
                    <div class="task-list">
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                        <div class="task-row"><input type="checkbox" class="checkbox"><input type="text" class="line-input"></div>
                    </div>
                </aside>

                <section class="days-grid">
                    <div class="day-box">
                        <div class="day-header">
                            <span class="day-name">MONDAY</span>
                            <input type="checkbox" class="checkbox">
                        </div>
                        <textarea class="day-input" spellcheck="false"></textarea>
                    </div>
                    
                    <div class="day-box">
                        <div class="day-header">
                            <span class="day-name">TUESDAY</span>
                            <input type="checkbox" class="checkbox">
                        </div>
                        <textarea class="day-input" spellcheck="false"></textarea>
                    </div>
                    
                    <div class="day-box">
                        <div class="day-header">
                            <span class="day-name">WEDNESDAY</span>
                            <input type="checkbox" class="checkbox">
                        </div>
                        <textarea class="day-input" spellcheck="false"></textarea>
                    </div>

                    <div class="day-box thursday">
                        <div class="day-header">
                            <span class="day-name">THURSDAY</span>
                            <input type="checkbox" class="checkbox">
                        </div>
                        <textarea class="day-input" spellcheck="false"></textarea>
                    </div>
                    
                    <div class="day-box friday">
                        <div class="day-header">
                            <span class="day-name">FRIDAY</span>
                            <input type="checkbox" class="checkbox">
                        </div>
                        <textarea class="day-input" spellcheck="false"></textarea>
                    </div>
                    
                    <div class="weekend-box">
                        <div class="day-box">
                            <div class="day-header">
                                <span class="day-name">SATURDAY</span>
                                <input type="checkbox" class="checkbox">
                            </div>
                            <textarea class="day-input" spellcheck="false"></textarea>
                        </div>
                        
                        <div class="day-box sunday">
                            <div class="day-header">
                                <span class="day-name">SUNDAY</span>
                                <input type="checkbox" class="checkbox">
                            </div>
                            <textarea class="day-input" spellcheck="false"></textarea>
                        </div>
                    </div>
                </section>

            </main>
        </div>
    </div>

</body>
</html>
